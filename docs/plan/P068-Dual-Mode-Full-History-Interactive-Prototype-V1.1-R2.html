function histDrawLine(points){let path=points.map((p,i)=>`${i===0?'M':'L'} ${p.x} ${p.y}`).join(' ');return `<path class="chartline" d="${path}"/>`+points.map(p=>`<circle class="chartdot" cx="${p.x}" cy="${p.y}" r="4"><title>平均 ${histNumber(p.avg)}</title></circle>`).join('')}
function histScatterChart(xs,mode){

 for(let j=1;j<maxFreq;j++){let xx=left+j/maxFreq*(right-left);svg+=`<text x="${xx}" y="${y0+17}" text-anchor="middle">${j}</text>`}

 let buckets=new Map();weeks.forEach(w=>{let q=buckets.get(w.count)||{count:w.count,n:0,sum:0};q.n++;q.sum+=w.avg;buckets.set(w.count,q)});

 if(mode==='reps'){let l=xs.filter(x=>x.mode==='reps');return [['最佳单次总次数',l.length?Math.max(...l.map(total)):'—','次'],['最佳单组',l.length?Math.max(...l.flatMap(x=>x.sets)):'—','次'],['最多完成组数',l.length?Math.max(...l.map(x=>x.sets.length)):'—','组'],['训练总次数',l.reduce((a,x)=>a+total(x),0),'次']];}

function getNum(name,min,max){let v=Number($(name)?.value);return Number.isInteger(v)&&v>=min&&v<=max?v:null}
function inputSets(){let nodes=[...document.querySelectorAll('#editSetFields .editSetInput')],values=nodes.map(x=>Number(x.value));if(!values.length||values.some(v=>!Number.isInteger(v)||v<1||v>999))return null;return values}
function keepDraft(){persist(true);paint()}
function ensureReps(){if(s.timer){notify('请先结束正在进行的计时训练');return false}if(s.draft&&s.draft.projectId!==s.projectId){notify('请先处理其他项目的未完成草稿');return false}return true}
function updateTime(){if(s.tab!=='time'||project().mode!=='time'||!s.timer||s.timer.projectId!==s.projectId)return;let v=timeMs()/1000,p=project();let remaining=Math.max(0,p.targetSec-v);if($('timerMain'))$('timerMain').textContent=remaining<=0?'已达标':fmtTime(Math.ceil(remaining));if($('timerElapsed'))$('timerElapsed').textContent=fmtTime(v);if($('timerRing'))$('timerRing').setAttribute('stroke-dashoffset',(578.05*(1-Math.min(100,100*v/p.targetSec)/100)).toFixed(2));if($('timerPercent'))$('timerPercent').textContent=Math.round(Math.min(100,100*v/p.targetSec))+'%'}
function downloadFile(name,body,type){let blob=new Blob([body],{type}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),7000)}
function doExport(){let payload={app:'p068-interactive-html-demo',version:3,exportedAt:new Date().toISOString(),state:s};downloadFile('P068-V11-Interactive-Demo-Backup.json',JSON.stringify(payload,null,2),'application/json;charset=utf-8');notify('原型记录 JSON 已导出')}
function validateImported(d){if(d?.app!=='p068-interactive-html-demo'||d.version!==3)throw Error('仅支持本 HTML 导出的演示备份');let x=d.state;if(!x||!Array.isArray(x.projects)||!Array.isArray(x.sessions)||x.projects.length>100||x.sessions.length>5000)throw Error('备份结构无效或文件过大');if(!x.projects.every(p=>typeof p.id==='string'&&typeof p.name==='string'&&['time','reps'].includes(p.mode)))throw Error('项目数据无效');let ids=new Set(x.projects.map(p=>p.id));if(x.sessions.some(a=>!ids.has(a.projectId)||!['time','reps'].includes(a.mode)||(a.mode==='reps'&&(!Array.isArray(a.sets)||a.sets.some(n=>!Number.isInteger(n)||n<1||n>999)))))throw Error('训练数据无效');if(!['light','dark'].includes(x.theme))throw Error('主题数据无效');x.version=3;x.tab='time';x.projectId=ids.has(x.projectId)?x.projectId:x.projects[0]?.id;x.filterProject=ids.has(x.filterProject)?x.filterProject:'all';x.range='all';x.timer=null;return x}
function switchTab(v){
 if(!['time','reps','history','settings'].includes(v))return;
 if(['time','reps'].includes(s.tab)){
   let active=project();if(active?.mode===s.tab){if(s.tab==='time')s.lastTimeId=active.id;else s.lastRepsId=active.id;}
 }
 if(v==='history'&&['time','reps'].includes(s.tab)){
   s.filterProject=s.projectId;
 }
 s.tab=v;
 if(v==='time')s.projectId=s.projects.some(p=>p.id===s.lastTimeId&&p.mode==='time')?s.lastTimeId:s.projects.find(p=>p.mode==='time'&&!p.archived)?.id||s.projectId;
 if(v==='reps')s.projectId=s.projects.some(p=>p.id===s.lastRepsId&&p.mode==='reps')?s.lastRepsId:s.projects.find(p=>p.mode==='reps'&&!p.archived)?.id||s.projectId;
 persist();paint(false);
}

case 'saveNewProject':case 'saveEditProject':{let name=$('fName').value.trim(),mode=modal.data.mode||(act==='saveEditProject'?project(modal.data.projectId).mode:'reps'),sets=getNum('fSets',1,40),reps=getNum('fReps',1,999),min=getNum('fMinutes',1,1440);if(!name||name.length>30){notify('请输入1～30字的项目名称');return}if(s.projects.some(a=>a.name===name&&(!p||act==='saveNewProject'||a.id!==p.id))){notify('已有同名项目');return}if(mode==='reps'&&(sets==null||reps==null)||mode==='time'&&min==null){notify('请填写有效的组数、次数或分钟数');return}let rec;if(act==='saveEditProject'){rec=project(modal.data.projectId);Object.assign(rec,{name,planSets:mode==='reps'?sets:rec.planSets,planReps:mode==='reps'?reps:rec.planReps,targetSec:mode==='time'?min*60:rec.targetSec})}else{rec={id:id(),name,mode,targetSec:mode==='time'?min*60:900,planSets:mode==='reps'?sets:3,planReps:mode==='reps'?reps:10,archived:false};s.projects.push(rec);s.projectId=rec.id;s.filterProject=rec.id;s.tab=rec.mode;if(rec.mode==='time')s.lastTimeId=rec.id;else s.lastRepsId=rec.id}s.search='';persist(true);closeModal();paint(false);notify(act==='saveEditProject'?'项目已保存':'项目已创建');return}

case 'repPlus':case 'repMinus':{let input=$('nextReps'),v=Number(input.value);v=Number.isFinite(v)?v:p.planReps;v=Math.max(1,Math.min(999,v+(act==='repPlus'?1:-1)));input.value=v;s.draft.nextReps=v;persist();return}

case 'setTimeTarget':p.targetSec=+el.dataset.val;persist(true);paint();return;
case 'startTime':if(s.draft){notify('请先处理未完成的计次训练');return}if(s.timer){notify('已有进行中的计时训练');return}s.timer={projectId:p.id,elapsedMs:0,resumeAt:Date.now(),running:true};persist();paint();return;

case 'editHistory':modalOpen('historyEdit',{id:key});return;
case 'saveHistoryEdit':{let item=s.sessions.find(a=>a.id===modal.data.id),when=new Date($('recordDate').value);if(!Number.isFinite(when.getTime())){notify('请输入有效日期');return}let values=null,sec=null;if(item.mode==='reps'){values=inputSets();if(!values){notify('每组次数须为1～999，至少1组');return}}else{sec=getNum('recordSec',1,86400);if(sec==null){notify('时长输入不正确');return}}item.endedAt=when.toISOString();item.note=($('recordNote')?.value||'').trim().slice(0,250);if(item.mode==='reps')item.sets=values;else item.actualSec=sec;persist(true);closeModal();paint();notify('历史已修改，统计已更新');return}

$('phone').addEventListener('change',e=>{if(e.target.id==='historyProject'){s.filterProject=e.target.value;s.search='';persist();paint()}else if(e.target.id==='historyRange'){s.range=e.target.value;persist();paint()}else if(e.target.id==='nextReps'){let n=getNum('nextReps',1,999);if(n&&s.draft){s.draft.nextReps=n;persist()}}});
$('phone').addEventListener('input',e=>{if(e.target.id==='historySearch'){let cursor=e.target.selectionStart;s.search=e.target.value;persist();paint();let box=$('historySearch');if(box){box.focus();box.setSelectionRange(cursor,cursor)}}});
document.querySelectorAll('[data-quick]').forEach(b=>b.addEventListener('click',()=>{let p=s.projects.find(p=>p.mode===b.dataset.quick);if(p){s.projectId=p.id;s.filterProject=p.id;s.tab=p.mode;if(p.mode==='time')s.lastTimeId=p.id;else s.lastRepsId=p.id;persist();paint(false)}}));
$('importFile').addEventListener('change',async e=>{let file=e.target.files?.[0];e.target.value='';if(!file)return;try{if(file.size>2*1024*1024)throw Error('文件大于2MB');let obj=validateImported(JSON.parse(await file.text()));modalOpen('importPreview',{backup:obj})}catch(err){notify(err.message||'无法解析此备份')}});
window.addEventListener('keydown',e=>{if(e.key==='Escape'&&modal)closeModal()});
window.addEventListener('storage',e=>{if(e.key===KEY){s=read();paint(false)}});
function clock(){const el=$('clock');if(el)el.textContent=new Date().toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit',hour12:false});updateTime()}
clock();paint(false);setInterval(clock,550);
})();
</script>
