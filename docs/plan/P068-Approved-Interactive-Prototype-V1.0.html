<body>
<div class="desktop-wrap">
  <aside class="side-intro"><div class="mini-logo"><i></i>TIME / PROGRESS</div><h1>每一次坚持，<br>都有迹可循。</h1><p>时长进阶 · Android 产品交互原型<br>可操作的训练计时、训练记录和频率分析。数据存储在当前浏览器中。</p><div class="steps"><span><b>1</b>在「训练」设定目标并开始</span><span><b>2</b>结束后确认是否保存</span><span><b>3</b>到「历史」看图表和记录</span><span><b>4</b>在「设置」体验备份恢复</span></div></aside>
  <div class="phone" id="app"><div class="status"><span id="clock">9:41</span><span class="icons">●●● ▰</span></div><main class="scroll" id="content" aria-live="polite"></main><nav class="navbar" id="navbar" aria-label="主要导航"></nav><div id="overlay"></div><div id="toastHost"></div></div>
</div>
<input id="filePicker" type="file" accept="application/json,.json" hidden>
<script>
(()=>{'use strict';
const KEY='duration_progress_prototype_v12';
const seed={projects:[{id:'plank',name:'练习 A',target:25,presets:[15,20,25]},{id:'focus',name:'专注练习',target:15,presets:[10,15,20]}],projectId:'plank',sessions:[],demoView:true,theme:'light',sound:true,vibration:true,filter:'current',range:'all',chart:'trend',tab:'train',timer:null};
let state;try{let saved=JSON.parse(localStorage.getItem(KEY)||'null');state=saved?{...seed,...saved}:structuredClone(seed)}catch(e){state=JSON.parse(JSON.stringify(seed))}if(!Array.isArray(state.projects)||!state.projects.length)state.projects=JSON.parse(JSON.stringify(seed.projects));if(!Array.isArray(state.sessions))state.sessions=[];
let modal=null,toastTimeout=null,ticker=null;
const $=id=>document.getElementById(id), htmlSafe=s=>String(s??'').replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
function persist(){try{localStorage.setItem(KEY,JSON.stringify({...state,tab:undefined}))}catch(e){toast('本机存储空间不足，保存失败')}}
function nowIso(t=Date.now()){return new Date(t).toISOString()}
function uid(){return (typeof crypto!=='undefined'&&crypto.randomUUID)?crypto.randomUUID():'id-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2)}
function selected(){return state.projects.find(p=>p.id===state.projectId)||state.projects[0]}
function fmt(s){s=Math.max(0,Math.floor(Number(s)||0));return s>=3600?`${String(Math.floor(s/3600)).padStart(2,'0')}:${String(Math.floor(s%3600/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`:`${String(Math.floor(s/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`}
function minutes(s){let n=+(Number(s)/60).toFixed(1);return Number.isInteger(n)?n:n.toFixed(1)}
function elapsed(){let t=state.timer;if(!t)return 0;return Math.max(0,Math.floor(((t.pausedAt||Date.now())-t.startedAt-t.pausedMs)/1000))}
function dateShort(iso){return new Date(iso).toLocaleDateString('zh-CN',{month:'2-digit',day:'2-digit'})}
function dateFull(iso){return new Date(iso).toLocaleString('zh-CN',{year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hour12:false})}
function dayStart(t){let d=new Date(t);d.setHours(0,0,0,0);return d.getTime()}
function weekStart(t){let d=new Date(t);let dow=d.getDay();d.setDate(d.getDate()-(dow+6)%7);d.setHours(0,0,0,0);return d.getTime()}
const demo=(()=>{let list=[];let freqs=[2,5,3,5,2,4,3,4];let avgs=[10,12,14,13,17,18,19,21];let base=weekStart(Date.now())-7*7*86400000;freqs.forEach((n,wi)=>{for(let j=0;j<n;j++){let day=Math.floor(j*6/Math.max(1,n-1));let t=base+(wi*7+day)*86400000+18*3600000; if(t>Date.now())t=Date.now()-3600000;let actual=Math.max(60,Math.round((avgs[wi]+((j%3)-1)*1.8+(wi%2?0.6:0))*60));list.push({id:'demo-'+wi+'-'+j,projectId:'plank',targetSec:wi<3?900:wi<6?1200:1500,actualSec:actual,note:j===0&&wi===3?'调整呼吸节奏':j===1&&wi===6?'今天状态不错':'',startedAt:nowIso(t-actual*1000),endedAt:nowIso(t),createdAt:nowIso(t),updatedAt:nowIso(t)})}});return list.sort((a,b)=>new Date(b.endedAt)-new Date(a.endedAt))})();
function records(){return state.demoView?demo:state.sessions}
function filtered(){let all=records();if(state.filter==='current')all=all.filter(s=>s.projectId===selected().id);else if(state.filter!=='all')all=all.filter(s=>s.projectId===state.filter);if(state.range!=='all'){let cutoff=dayStart(Date.now())-(Number(state.range)-1)*86400000;all=all.filter(s=>new Date(s.endedAt).getTime()>=cutoff)}return all.slice().sort((a,b)=>new Date(b.endedAt)-new Date(a.endedAt))}
function stats(all){let sum=all.reduce((a,s)=>a+s.actualSec,0);return {n:all.length,avg:all.length?Math.round(sum/all.length):0,best:all.length?Math.max(...all.map(s=>s.actualSec)):0,rate:all.length?Math.round(all.filter(s=>s.actualSec>=s.targetSec).length/all.length*100):0}}
function weekly(all){let m=new Map();for(let s of all){let w=weekStart(new Date(s.endedAt).getTime());let x=m.get(w)||{week:w,count:0,sum:0,achieve:0};x.count++;x.sum+=s.actualSec;x.achieve+=(s.actualSec>=s.targetSec?1:0);m.set(w,x)}return [...m.values()].sort((a,b)=>a.week-b.week).map(w=>({...w,avg:w.sum/w.count/60,label:dateShort(nowIso(w.week))}))}
function toast(s){let host=$('toastHost');if(!host)return;host.innerHTML=`<div class="toast" role="status">${htmlSafe(s)}</div>`;clearTimeout(toastTimeout);toastTimeout=setTimeout(()=>host.innerHTML='',2700)}
function navIcon(n){return {train:'<circle cx="12" cy="13" r="8"/><path d="M12 13l3-3M9 2h6M12 5v2"/>',history:'<path d="M4 20V10M9 20V4M14 20v-8M19 20V7"/>',settings:'<path d="M4 7h16M4 17h16"/><circle cx="9" cy="7" r="2" fill="currentColor" stroke="none"/><circle cx="16" cy="17" r="2" fill="currentColor" stroke="none"/>'}[n]}
function renderNav(){$('navbar').innerHTML=[['train','训练'],['history','历史'],['settings','设置']].map(([id,title])=>`<button class="nav ${state.tab===id?'active':''}" data-act="tab" data-val="${id}" aria-label="${title}"><svg viewBox="0 0 24 24">${navIcon(id)}</svg>${title}</button>`).join('')}
function render(){document.documentElement.dataset.theme=state.theme;document.querySelector('meta[name="theme-color"]').content=state.theme==='light'?'#f7f8f7':'#111a19';$('clock').textContent=new Date().toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit',hour12:false});renderNav();let scroll=$('content'),pos=scroll.scrollTop;scroll.innerHTML=state.tab==='train'?trainHTML():state.tab==='history'?historyHTML():settingsHTML();scroll.scrollTop=pos;renderModal();}
function trainHTML(){let p=selected(),t=state.timer,running=!!t,used=elapsed(),remaining=Math.max(0,(t?t.targetSec:p.target*60)-used),progress=t?Math.min(1,used/t.targetSec):0;let sc=2*Math.PI*96;let last=state.sessions.filter(x=>x.projectId===p.id).sort((a,b)=>new Date(b.endedAt)-new Date(a.endedAt))[0];let best=state.sessions.filter(x=>x.projectId===p.id).reduce((max,s)=>Math.max(max,s.actualSec),0);
return `<div class="page"><div class="top"><h2>训练</h2><span class="eyebrow">专注每一次进步</span></div><button class="project-selector" ${running?'disabled':''} data-act="projects"><div><strong>${htmlSafe(p.name)}</strong><div class="kind">当前计时项目</div></div><span class="chev">⌄</span></button>
<div class="countdown"><div class="circle"><svg class="ring" viewBox="0 0 214 214"><circle class="ring-track" cx="107" cy="107" r="96"/><circle class="ring-value" cx="107" cy="107" r="96" stroke-dasharray="${sc}" stroke-dashoffset="${sc*(1-progress)}"/></svg><div class="timer-center"><div class="timer-label">${t?(t.pausedAt?'已暂停':used>=t.targetSec?'目标已达到':'距离目标'):'目标倒计时'}</div><div class="timer-number" id="timerDisplay">${fmt(t?remaining:p.target*60)}</div><div class="timer-sub ${t&&used>=t.targetSec?'done':''}" id="timerSub">${t?(used>=t.targetSec?'已超出 '+fmt(used-t.targetSec):'已坚持 '+fmt(used)):'准备开始'}</div></div></div><div class="time-meta"><span>目标 <b id="goalTag">${t?minutes(t.targetSec):p.target} 分</b></span><span>实际 <b id="actualTag">${fmt(t?used:0)}</b></span></div></div>
${running?`<div class="actions"><button class="secondary-btn" data-act="pause">${t.pausedAt?'继续计时':'暂停'}</button><button class="primary" data-act="finish">结束训练</button></div><p class="hint">可随时结束。结束后由你决定本次是否计入历史记录。</p>`:
`<div class="section-head"><b>目标时长</b><button class="text-action" data-act="customGoal">自定义时间 ＋</button></div><div class="chips">${p.presets.map(m=>`<button class="chip ${p.target===m?'selected':''}" data-act="target" data-val="${m}">${m} 分</button>`).join('')}</div><div class="actions"><button class="primary" data-act="start">▶　开始训练</button></div>`}
<div class="two-stats"><div class="stat-small"><div class="desc">上次实际</div><div class="value">${last?minutes(last.actualSec)+' <small style="font-size:12px;font-weight:500">分</small>':'—'}</div></div><div class="stat-small"><div class="desc">个人最佳</div><div class="value">${best?minutes(best)+' <small style="font-size:12px;font-weight:500">分</small>':'—'}</div></div></div><p class="hint">目标按项目记忆。计时、记录和统计均不需要联网。</p></div>`}
function historyHTML(){let all=filtered(),k=stats(all);return `<div class="page"><div class="top"><h2>历史</h2><button class="small-link" data-act="newEntry">＋ 补录</button></div>${state.demoView?`<div class="inline-notice"><b>正在查看演示数据</b>　用于体验图表，不会混入个人记录。 <button class="link-small" data-act="demoOff">查看我的记录</button></div>`:''}<div class="filter-row"><select id="filterProject" aria-label="筛选项目"><option value="current" ${state.filter==='current'?'selected':''}>当前项目 · ${htmlSafe(selected().name)}</option><option value="all" ${state.filter==='all'?'selected':''}>全部项目</option>${state.projects.filter(p=>p.id!==selected().id).map(p=>`<option value="${htmlSafe(p.id)}" ${state.filter===p.id?'selected':''}>${htmlSafe(p.name)}</option>`).join('')}</select><select id="filterRange" aria-label="筛选时间"><option value="all" ${state.range==='all'?'selected':''}>全部时间</option>${[7,30,90].map(n=>`<option value="${n}" ${state.range==n?'selected':''}>近 ${n} 天</option>`).join('')}</select></div>
<div class="kpi-grid"><div class="kpi"><div class="n">有效记录</div><div class="v">${k.n}<span class="suffix">次</span></div></div><div class="kpi"><div class="n">平均实际</div><div class="v">${k.n?minutes(k.avg):'—'}<span class="suffix">分钟</span></div></div><div class="kpi"><div class="n">最佳时长</div><div class="v">${k.n?minutes(k.best):'—'}<span class="suffix">分钟</span></div></div><div class="kpi"><div class="n">目标达成率</div><div class="v">${k.n?k.rate+'%':'—'}</div></div></div>
<div class="panel"><div class="chart-switch-head"><h3 class="chart-title">${{trend:'实际时长趋势',weekly:'训练频率与平均时长',scatter:'每周次数与表现关系'}[state.chart]}</h3>${state.demoView?'<span class="demo-flag">演示数据</span>':''}</div><div class="pill-tabs"><button class="${state.chart==='trend'?'on':''}" data-act="chart" data-val="trend">时长趋势</button><button class="${state.chart==='weekly'?'on':''}" data-act="chart" data-val="weekly">周频率</button><button class="${state.chart==='scatter'?'on':''}" data-act="chart" data-val="scatter">频率关系</button></div>${chartHTML(all)}</div>
<div class="section-head"><b>训练记录 <span class="small-label">(${all.length})</span></b><button class="text-action" data-act="sortInfo">最新在前</button></div>${all.length?all.slice(0,60).map(s=>recordHTML(s)).join(''):`<div class="panel empty"><div class="empty-icon">▥</div>还没有记录。<br>完成一次训练或点击右上角「补录」，就会显示在这里。${!state.demoView?'<div style="margin-top:12px"><button class="link-small" data-act="demoOn">看看演示图表</button></div>':''}</div>`}</div>`}
function recordHTML(s){let p=state.projects.find(p=>p.id===s.projectId);let percentage=s.targetSec?Math.round(s.actualSec/s.targetSec*100):0;return `<div class="history-card"><div class="history-top"><span class="date">${dateFull(s.endedAt)}</span><span class="${s.actualSec>=s.targetSec?'status-ok':'status-not'}">${s.actualSec>=s.targetSec?'已达标':'未达标'}</span></div><div class="history-body"><strong>${minutes(s.actualSec)} <span>分钟</span></strong><span>目标 ${minutes(s.targetSec)} 分 · ${percentage}%</span></div><div class="history-note">${htmlSafe(p?.name||'已删除项目')}${s.note?' · '+htmlSafe(s.note):''}</div><div class="history-foot"><span class="small-label">${s.id.startsWith('demo-')?'示例记录':'已保存'}</span><div class="small-buttons">${s.id.startsWith('demo-')?'<span class="small-label">演示数据不可修改</span>':`<button data-act="editEntry" data-val="${htmlSafe(s.id)}">编辑</button><button class="danger" data-act="deleteEntry" data-val="${htmlSafe(s.id)}">删除</button>`}</div></div></div>`}
function svgBegin(){return '<svg class="chart" viewBox="0 0 340 205" role="img" aria-label="训练时长和频率数据图表">'}
function axisSvg(yMax,left=38,right=15){let s='';for(let i=0;i<=5;i++){let val=yMax*i/5,y=171-136*i/5;s+=`<line class="gridline" x1="${left}" y1="${y}" x2="${340-right}" y2="${y}"/><text x="${left-7}" y="${y+3}" text-anchor="end">${Number.isInteger(val)?val:val.toFixed(1)}</text>`}return s}
function chartHTML(all){if(!all.length)return '<div class="empty">完成训练后，趋势和频率图表会自动生成。</div>';return state.chart==='trend'?trendSVG(all):state.chart==='weekly'?weeklySVG(all):scatterSVG(all)}
function trendSVG(all){let data=all.slice().sort((a,b)=>new Date(a.endedAt)-new Date(b.endedAt)).slice(-10);let yMax=Math.max(10,Math.ceil(Math.max(...data.map(s=>Math.max(s.targetSec,s.actualSec)/60))/5)*5);let x0=39,w=286,barW=Math.min(23,Math.max(11,w/data.length*.55)),step=w/data.length;let s=svgBegin()+axisSvg(yMax)+`<text x="6" y="17">分钟</text>`;data.forEach((d,i)=>{let h=d.actualSec/60/yMax*136,x=x0+(i+.5)*step,y=171-h;let mark=171-d.targetSec/60/yMax*136;s+=`<rect class="bar" rx="4" x="${x-barW/2}" y="${y}" width="${barW}" height="${h}"><title>${dateFull(d.endedAt)}：实际 ${minutes(d.actualSec)} 分钟，目标 ${minutes(d.targetSec)} 分钟</title></rect><line class="target-mark" x1="${x-barW/2-1}" y1="${mark}" x2="${x+barW/2+1}" y2="${mark}"/><text text-anchor="middle" x="${x}" y="188">${dateShort(d.endedAt)}</text>`});return `<div class="legend"><span><i></i>实际时长</span><span><i class="secondary"></i>目标标记</span></div>`+s+'</svg><p class="chart-note">每根柱子代表一次训练；黄色短线表示该次目标，修改默认目标不会改变过去的数据。</p>'}
function weeklySVG(all){let data=weekly(all).slice(-7),maxCount=Math.max(5,Math.ceil(Math.max(...data.map(w=>w.count))/5)*5),maxDur=Math.max(20,Math.ceil(Math.max(...data.map(w=>w.avg))/5)*5),x0=39,w=266,step=w/data.length,bw=Math.min(24,step*.5);let s=svgBegin()+axisSvg(maxCount,39,34)+`<text x="5" y="17">次数</text><text x="314" y="17">分钟</text>`;for(let i=0;i<=5;i++){let v=maxDur*i/5,y=171-136*i/5;s+=`<text x="335" y="${y+3}" text-anchor="end">${Number.isInteger(v)?v:v.toFixed(1)}</text>`}let pts=[];data.forEach((d,i)=>{let x=x0+(i+.5)*step,h=d.count/maxCount*136;pts.push([x,171-d.avg/maxDur*136]);s+=`<rect class="bar" x="${x-bw/2}" y="${171-h}" width="${bw}" height="${h}" rx="4"><title>${d.label} 起：${d.count} 次，平均 ${d.avg.toFixed(1)} 分钟</title></rect><text x="${x}" y="188" text-anchor="middle">${d.label}</text>`});s+=`<polyline class="trend" points="${pts.map(p=>p.join(',')).join(' ')}"/>`+pts.map(p=>`<circle class="dot" cx="${p[0]}" cy="${p[1]}" r="4.5"/>`).join('');return `<div class="legend"><span><i></i>每周有效次数（左轴）</span><span><i class="secondary"></i>周平均分钟（右轴）</span></div>`+s+'</svg><p class="chart-note">两条纵轴单位不同：观察训练次数变化时，平均时长是否也发生变化。</p>'}
function scatterSVG(all){let data=weekly(all),maxCount=Math.max(5,Math.max(...data.map(x=>x.count))+1),maxDur=Math.max(20,Math.ceil(Math.max(...data.map(x=>x.avg))/5)*5);let x0=43,w=268;let s=svgBegin()+axisSvg(maxDur,43,26)+`<text x="6" y="17">分钟</text>`;for(let x=1;x<=maxCount;x++){let xpos=x0+(x/maxCount)*w;s+=`<text x="${xpos}" y="188" text-anchor="middle">${x}</text>`}data.forEach((d,i)=>{let x=x0+d.count/maxCount*w+((i%3)-1)*3,y=171-d.avg/maxDur*136;s+=`<circle class="scatter-dot" cx="${x}" cy="${y}" r="6"><title>${d.label} 起：每周 ${d.count} 次，平均 ${d.avg.toFixed(1)} 分钟</title></circle>`});s+=`<text x="174" y="201" text-anchor="middle">每周训练次数</text></svg>`;let g=new Map();data.forEach(w=>{let x=g.get(w.count)||{count:w.count,n:0,total:0};x.n++;x.total+=w.avg;g.set(w.count,x)});let trs=[...g.values()].sort((a,b)=>a.count-b.count).map(g=>`<tr><td>${g.count} 次/周</td><td>${g.n} 周</td><td>${(g.total/g.n).toFixed(1)} 分</td></tr>`).join('');return `<p class="chart-note">每个点是一周。横轴是当周训练次数，纵轴是该周每次训练的平均时长。</p>`+s+`<table class="compare-table"><thead><tr><th>训练频率</th><th>样本周数</th><th>平均时长</th></tr></thead><tbody>${trs}</tbody></table><p class="chart-note">只展示关联，不代表次数越多或越少一定更好。目标与训练条件不同时应谨慎比较。</p>`}
function settingsHTML(){let p=selected();return `<div class="page"><div class="top"><h2>设置</h2><span class="eyebrow">偏好与数据管理</span></div><div class="group-title">训练偏好</div><div class="settings-list"><div class="settings-row"><div class="left"><div class="name">训练项目</div><div class="detail">新建、改名或切换练习</div></div><button data-act="projects">管理　›</button></div><div class="settings-row"><div class="left"><div class="name">预设目标</div><div class="detail">${htmlSafe(p.name)} · ${p.presets.join(' / ')} 分钟</div></div><button data-act="presets">编辑　›</button></div><div class="settings-row"><div class="left"><div class="name">提示音</div><div class="detail">达到目标时提示（浏览器演示）</div></div><button aria-label="切换提示音" class="switch ${state.sound?'on':''}" data-act="toggleSound"></button></div><div class="settings-row"><div class="left"><div class="name">震动提示</div><div class="detail">需要设备支持，浏览器可能限制</div></div><button aria-label="切换震动" class="switch ${state.vibration?'on':''}" data-act="toggleVibration"></button></div></div>
<div class="group-title">外观</div><div class="settings-list"><div class="settings-row"><div class="left"><div class="name">深色模式</div><div class="detail">首次打开默认浅色，切换后记住选择</div></div><button aria-label="切换深色模式" class="switch ${state.theme==='dark'?'on':''}" data-act="theme"></button></div></div>
<div class="group-title">数据管理</div><div class="settings-list"><div class="settings-row"><div class="left"><div class="name">导出完整备份</div><div class="detail">JSON 文件 · 包含项目、历史、目标和设置</div></div><button data-act="exportJson">导出　›</button></div><div class="settings-row"><div class="left"><div class="name">导出历史表格</div><div class="detail">CSV 文件 · 可以用 Excel 打开</div></div><button data-act="exportCsv">导出　›</button></div><div class="settings-row"><div class="left"><div class="name">导入与恢复</div><div class="detail">检查备份后，选择合并或覆盖</div></div><button data-act="import">导入　›</button></div></div>
<div class="group-title">原型演示</div><div class="settings-list"><div class="settings-row"><div class="left"><div class="name">演示图表</div><div class="detail">切换查看示例数据，个人记录不受影响</div></div><button data-act="toggleDemo">${state.demoView?'查看个人':'看演示'}　›</button></div><div class="settings-row"><div class="left"><div class="name">清空个人训练记录</div><div class="detail">只删除当前浏览器里的个人记录</div></div><button data-act="clearRecords" style="color:var(--red)">清空　›</button></div></div><p class="hint">这是 HTML 交互原型：当前数据保存在此浏览器的 localStorage 中，不等同于最终 APK 的 Room 数据库。手机清理浏览器数据可能导致记录丢失，请先导出备份。</p></div>`}
function modalOpen(type,payload={}){modal={type,...payload};renderModal()}
function closeModal(){modal=null;renderModal()}
function sheet(content){return `<div class="modal-backdrop" id="backdrop"><section class="sheet" role="dialog" aria-modal="true"><button class="sheet-close" aria-label="关闭" data-act="closeModal">×</button>${content}</section></div>`}
function renderModal(){let host=$('overlay');if(!modal){host.innerHTML='';return}let p=selected(),type=modal.type,content='';
if(type==='projects'){content=`<h3>选择训练项目</h3><p class="subtitle">每个项目独立保存目标、预设时长和统计记录。</p>${state.projects.map(x=>`<button class="choice ${x.id===p.id?'selected':''}" data-act="chooseProject" data-val="${htmlSafe(x.id)}"><span><b>${htmlSafe(x.name)}</b><br><em>目标 ${x.target} 分钟</em></span><span>${x.id===p.id?'✓':'›'}</span></button>`).join('')}<div class="sheet-actions"><button class="secondary-btn" data-act="renameProject">修改当前名称</button><button class="primary" data-act="addProject">＋ 新建项目</button></div>`}
if(type==='projectEdit'){content=`<h3>${modal.isNew?'新建项目':'修改项目名称'}</h3><p class="subtitle">建议使用自己能快速辨认的名称。</p><label class="label" for="projectName">项目名称</label><input id="projectName" maxlength="24" placeholder="例如：靠墙静蹲" value="${modal.isNew?'':htmlSafe(selected().name)}"><div class="sheet-actions"><button class="secondary-btn" data-act="closeModal">取消</button><button class="primary" data-act="saveProject">保存</button></div>`}
if(type==='goal'){content=`<h3>自定义目标时长</h3><p class="subtitle">设置后自动记忆，下次打开仍使用这个目标。</p><label class="label" for="goalValue">分钟（1～300）</label><input id="goalValue" inputmode="decimal" type="number" min="1" max="300" step="0.5" value="${p.target}"><div class="sheet-actions"><button class="secondary-btn" data-act="closeModal">取消</button><button class="primary" data-act="saveGoal">保存目标</button></div>`}
if(type==='presets'){content=`<h3>编辑预设档位</h3><p class="subtitle">输入分钟数，以逗号隔开。支持 1～8 个档位，每个档位 1～300 分钟。</p><label class="label" for="presetValues">预设分钟</label><input id="presetValues" placeholder="例如：10, 15, 20, 25" value="${p.presets.join(', ')}"><div class="sheet-actions"><button class="secondary-btn" data-act="closeModal">取消</button><button class="primary" data-act="savePresets">保存档位</button></div>`}
if(type==='finish'){let t=state.timer,used=elapsed();content=`<h3>本次训练结束</h3><p class="subtitle">实际完成 <strong style="color:var(--accent);font-size:19px">${fmt(used)}</strong>　目标 ${fmt(t.targetSec)}<br>${used>=t.targetSec?'已达到目标，表现不错。':'未达到目标，也可以如实记录。'}</p><label class="label" for="finishNote">本次备注（选填）</label><textarea id="finishNote" maxlength="300" placeholder="例如：今天调整了呼吸，感觉更稳定"></textarea><div class="sheet-actions"><button class="secondary-btn" data-act="discard">不计入</button><button class="primary" data-act="saveFinish">计入历史</button></div><p class="hint">仅点「计入历史」才会保存有效训练记录。</p>`}
if(type==='entry'){let e=modal.id?state.sessions.find(x=>x.id===modal.id):null;let when=e?new Date(e.endedAt):new Date(),localDate=new Date(when.getTime()-when.getTimezoneOffset()*60000).toISOString().slice(0,16);content=`<h3>${e?'编辑训练记录':'补录训练记录'}</h3><p class="subtitle">可以补充漏记的训练，保存后图表自动重新计算。</p><label class="label" for="entryProject">所属项目</label><select id="entryProject">${state.projects.map(p=>`<option value="${htmlSafe(p.id)}" ${e?.projectId===p.id||!e&&p.id===state.projectId?'selected':''}>${htmlSafe(p.name)}</option>`).join('')}</select><label class="label" for="entryDate">完成时间</label><input type="datetime-local" id="entryDate" value="${localDate}"><label class="label" for="entryTarget">目标分钟</label><input type="number" step="0.1" min="0.1" max="300" id="entryTarget" value="${e?+(e.targetSec/60).toFixed(2):selected().target}"><label class="label" for="entryActual">实际分钟</label><input type="number" step="0.1" min="0.1" max="600" id="entryActual" value="${e?+(e.actualSec/60).toFixed(2):10}"><label class="label" for="entryNote">备注（选填）</label><textarea id="entryNote" maxlength="300" placeholder="这次的感受或方法">${htmlSafe(e?.note||'')}</textarea><div class="sheet-actions"><button class="secondary-btn" data-act="closeModal">取消</button><button class="primary" data-act="saveEntry">保存记录</button></div>`}
if(type==='delete'){content=`<h3>删除这条训练记录？</h3><p class="subtitle">删除后统计图表将重新计算。建议先导出完整备份。</p><div class="sheet-actions"><button class="secondary-btn" data-act="closeModal">取消</button><button class="danger-btn" data-act="confirmDelete">确定删除</button></div>`}
if(type==='clear'){content=`<h3>清空所有个人记录？</h3><p class="subtitle">这会删除个人训练历史，不会删除项目及目标设置。无法直接撤销，请先备份。</p><div class="sheet-actions"><button class="secondary-btn" data-act="closeModal">取消</button><button class="danger-btn" data-act="confirmClear">确认清空</button></div>`}
if(type==='importCheck'){content=`<h3>准备恢复备份</h3><p class="subtitle">已检查文件格式。包含 ${modal.data.sessions.length} 条记录、${modal.data.projects.length} 个项目。请选择恢复方式。</p><button class="choice" data-act="importMerge"><span><b>合并记录</b><br><em>相同记录 ID 只保留现有版本，避免重复</em></span><span>›</span></button><button class="choice" data-act="importReplace"><span><b>覆盖当前数据</b><br><em>先保存现有数据的安全副本，再用备份替换</em></span><span>›</span></button><p class="danger-note">覆盖模式会替换个人记录及项目设置。建议先导出当前备份。</p>`}
if(type==='importReplaceConfirm'){content=`<h3>最后确认覆盖</h3><p class="subtitle">将用备份中的全部数据替换当前记录与项目配置。此操作不可直接撤销。</p><div class="sheet-actions"><button class="secondary-btn" data-act="closeModal">取消</button><button class="danger-btn" data-act="confirmImportReplace">覆盖恢复</button></div>`}
if(type==='info'){content=`<h3>历史记录顺序</h3><p class="subtitle">按完成时间从新到旧排列。修改时间后，列表与趋势图会一同更新。</p><button class="secondary-btn" style="width:100%" data-act="closeModal">知道了</button>`}
host.innerHTML=sheet(content);let bd=$('backdrop');bd.addEventListener('click',e=>{if(e.target===bd)closeModal()});}
function promptValue(id){return ($(id)?.value||'').trim()}
function validDuration(v,min,max){let n=Number(v);return Number.isFinite(n)&&n>=min&&n<=max?n:null}
function setGoal(n){selected().target=n;persist();render();toast('目标已保存为 '+n+' 分钟')}
function demoToggle(v){state.demoView=v;persist();render();toast(v?'已切换到演示数据':'已切换到个人记录')}
function start(){let p=selected();state.timer={projectId:p.id,targetSec:Math.round(p.target*60),startedAt:Date.now(),pausedMs:0,pausedAt:null};persist();render();toast('已开始计时')}
function pause(){let t=state.timer;if(!t)return;if(t.pausedAt){t.pausedMs+=Date.now()-t.pausedAt;t.pausedAt=null}else{t.pausedAt=Date.now()}persist();render()}
function finish(){if(!state.timer)return;if(!state.timer.pausedAt){state.timer.pausedAt=Date.now()}persist();modalOpen('finish')}
function beep(){if(!state.sound)return;try{const Ctx=window.AudioContext||window.webkitAudioContext;if(!Ctx)return;let c=new Ctx(),o=c.createOscillator(),g=c.createGain();o.frequency.value=700;o.type='sine';g.gain.value=.035;o.connect(g);g.connect(c.destination);o.start();o.stop(c.currentTime+.16);setTimeout(()=>c.close(),550)}catch(e){}}
function tick(){let t=state.timer;if(!t||t.pausedAt)return;let sec=elapsed(),left=Math.max(0,t.targetSec-sec),sc=2*Math.PI*96,ring=document.querySelector('.ring-value');if(!ring)return;let display=$('timerDisplay'),sub=$('timerSub'),actual=$('actualTag');if(display)display.textContent=fmt(left);if(sub){sub.textContent=sec>=t.targetSec?'已超出 '+fmt(sec-t.targetSec):'已坚持 '+fmt(sec);sub.classList.toggle('done',sec>=t.targetSec)}if(actual)actual.textContent=fmt(sec);ring.setAttribute('stroke-dashoffset',sc*(1-Math.min(1,sec/t.targetSec)));let label=document.querySelector('.timer-label');if(label)label.textContent=sec>=t.targetSec?'目标已达到':'距离目标';if(sec>=t.targetSec&&!t.notified){t.notified=true;persist();beep();if(state.vibration&&navigator.vibrate)navigator.vibrate([100,70,100]);toast('已达到目标，可以继续坚持！')}}
function download(name,blob){let url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),60000)}
function exportJson(){let d={app:'duration-progress',version:1,exportedAt:nowIso(),projects:state.projects,projectId:state.projectId,sessions:state.sessions,settings:{theme:state.theme,sound:state.sound,vibration:state.vibration}};download('duration-progress-backup-'+new Date().toISOString().slice(0,10)+'.json',new Blob([JSON.stringify(d,null,2)],{type:'application/json;charset=utf-8'}));toast('完整备份已导出（仅个人数据）')}
function exportCsv(){let cols=['完成时间','项目','目标秒数','实际秒数','达标','备注','记录ID'];let quote=v=>'"'+String(v??'').replaceAll('"','""')+'"';let rows=state.sessions.map(s=>[dateFull(s.endedAt),state.projects.find(p=>p.id===s.projectId)?.name||'',s.targetSec,s.actualSec,s.actualSec>=s.targetSec?'是':'否',s.note,s.id]);download('duration-progress-history-'+new Date().toISOString().slice(0,10)+'.csv',new Blob(['\ufeff'+[cols,...rows].map(r=>r.map(quote).join(',')).join('\r\n')],{type:'text/csv;charset=utf-8'}));toast('CSV 已导出（仅个人数据）')}
function validateBackup(d){if(!d||d.app!=='duration-progress'||d.version!==1||!Array.isArray(d.projects)||!Array.isArray(d.sessions)||d.projects.length<1||d.projects.length>100||d.sessions.length>100000)throw Error('不支持的备份文件格式');let ids=new Set();for(let p of d.projects){if(!p||typeof p.id!=='string'||!p.id||typeof p.name!=='string'||p.name.length>100||!validDuration(p.target,1,300)||!Array.isArray(p.presets)||p.presets.length>20||!p.presets.every(n=>validDuration(n,1,300)!==null))throw Error('备份中的项目数据无效');ids.add(p.id)}for(let s of d.sessions){if(!s||typeof s.id!=='string'||typeof s.projectId!=='string'||!ids.has(s.projectId)||!Number.isInteger(s.actualSec)||s.actualSec<1||s.actualSec>36000||!Number.isInteger(s.targetSec)||s.targetSec<1||s.targetSec>18000||!Number.isFinite(new Date(s.endedAt).getTime())||typeof s.note!=='string'||s.note.length>1000)throw Error('备份中的训练记录有误')}return d}
function mergeBackup(d){let ps=new Map(state.projects.map(p=>[p.id,p]));d.projects.forEach(p=>{if(!ps.has(p.id))ps.set(p.id,p)});let ss=new Map(state.sessions.map(s=>[s.id,s]));d.sessions.forEach(s=>{if(!ss.has(s.id))ss.set(s.id,s)});state.projects=[...ps.values()];state.sessions=[...ss.values()];state.demoView=false;persist();closeModal();render();toast('合并完成：现有记录未被覆盖')}
function replaceBackup(d){state.projects=d.projects;state.projectId=d.projects.some(p=>p.id===d.projectId)?d.projectId:d.projects[0].id;state.sessions=d.sessions;state.theme=['light','dark'].includes(d.settings?.theme)?d.settings.theme:'light';state.sound=typeof d.settings?.sound==='boolean'?d.settings.sound:true;state.vibration=typeof d.settings?.vibration==='boolean'?d.settings.vibration:true;state.demoView=false;state.timer=null;state.filter='current';state.range='all';state.tab='history';persist();closeModal();render();toast('备份恢复成功')}
async function handleClick(e){let btn=e.target.closest('[data-act]');if(!btn||btn.disabled)return;let act=btn.dataset.act,val=btn.dataset.val;
if(act==='tab'){state.tab=val;persist();$('content').scrollTop=0;render();return}
if(act==='closeModal'){closeModal();return}
if(act==='projects'){if(state.timer){toast('请先结束当前训练');return}modalOpen('projects');return}
if(act==='chooseProject'){state.projectId=val;state.filter='current';persist();closeModal();render();return}
if(act==='addProject'){modalOpen('projectEdit',{isNew:true});return}
if(act==='renameProject'){modalOpen('projectEdit',{isNew:false});return}
if(act==='saveProject'){let name=promptValue('projectName');if(!name){toast('请输入项目名称');return}if(state.projects.some(x=>x.name===name&&(modal.isNew||x.id!==state.projectId))){toast('这个项目名称已经存在');return}if(modal.isNew){let id=uid();state.projects.push({id,name,target:15,presets:[10,15,20,25]});state.projectId=id}else selected().name=name;persist();closeModal();render();toast('项目已保存');return}
if(act==='target'){if(!state.timer)setGoal(Number(val));return}
if(act==='customGoal'){modalOpen('goal');return}
if(act==='saveGoal'){let v=validDuration(promptValue('goalValue'),1,300);if(v===null){toast('请输入 1～300 分钟');return}closeModal();setGoal(v);return}
if(act==='presets'){modalOpen('presets');return}
if(act==='savePresets'){let list=promptValue('presetValues').split(/[,，、\s]+/).filter(Boolean).map(Number);if(!list.length||list.length>8||list.some(n=>validDuration(n,1,300)===null)){toast('请设置 1～8 个有效档位');return}selected().presets=[...new Set(list)].sort((a,b)=>a-b);persist();closeModal();render();toast('预设档位已更新');return}
if(act==='start'){start();return}
if(act==='pause'){pause();return}
if(act==='finish'){finish();return}
if(act==='discard'){state.timer=null;persist();closeModal();render();toast('本次未计入历史');return}
if(act==='saveFinish'){let t=state.timer;if(!t)return;let sec=elapsed(),ended=t.pausedAt||Date.now();if(sec<=0){toast('计时时长不足 1 秒，不能保存');return}let rec={id:uid(),projectId:t.projectId,targetSec:t.targetSec,actualSec:sec,note:promptValue('finishNote'),startedAt:nowIso(t.startedAt),endedAt:nowIso(ended),createdAt:nowIso(),updatedAt:nowIso()};state.sessions.push(rec);state.demoView=false;state.timer=null;persist();closeModal();state.tab='history';state.filter='current';$('content').scrollTop=0;render();toast('训练已计入历史');return}
if(act==='chart'){state.chart=val;persist();render();return}
if(act==='demoOff'){demoToggle(false);return}
if(act==='demoOn'){demoToggle(true);return}
if(act==='toggleDemo'){demoToggle(!state.demoView);return}
if(act==='newEntry'){if(state.demoView)demoToggle(false);modalOpen('entry');return}
if(act==='editEntry'){modalOpen('entry',{id:val});return}
if(act==='saveEntry'){let id=modal?.id,original=id?state.sessions.find(x=>x.id===id):null,date=promptValue('entryDate'),d=new Date(date),tar=validDuration(promptValue('entryTarget'),.1,300),actMin=validDuration(promptValue('entryActual'),.1,600);if(!date||!Number.isFinite(d.getTime())||tar===null||actMin===null){toast('请填写正确的日期和时长');return}let t=nowIso(d.getTime()),data={id:id||uid(),projectId:promptValue('entryProject'),targetSec:Math.max(1,Math.round(tar*60)),actualSec:Math.max(1,Math.round(actMin*60)),note:promptValue('entryNote'),startedAt:original?.startedAt||nowIso(d.getTime()-Math.round(actMin*60000)),endedAt:t,createdAt:original?.createdAt||nowIso(),updatedAt:nowIso()};if(original)state.sessions=state.sessions.map(s=>s.id===id?data:s);else state.sessions.push(data);state.demoView=false;persist();closeModal();render();toast(original?'记录已更新':'已补录记录');return}
if(act==='deleteEntry'){modalOpen('delete',{id:val});return}
if(act==='confirmDelete'){state.sessions=state.sessions.filter(s=>s.id!==modal.id);persist();closeModal();render();toast('记录已删除');return}
if(act==='sortInfo'){modalOpen('info');return}
if(act==='theme'){state.theme=state.theme==='light'?'dark':'light';persist();render();return}
if(act==='toggleSound'){state.sound=!state.sound;persist();render();return}
if(act==='toggleVibration'){state.vibration=!state.vibration;persist();render();return}
if(act==='exportJson'){exportJson();return}
if(act==='exportCsv'){exportCsv();return}
if(act==='import'){$('filePicker').click();return}
if(act==='importMerge'){mergeBackup(modal.data);return}
if(act==='importReplace'){modalOpen('importReplaceConfirm',{data:modal.data});return}
if(act==='confirmImportReplace'){replaceBackup(modal.data);return}
if(act==='clearRecords'){modalOpen('clear');return}
if(act==='confirmClear'){state.sessions=[];state.demoView=false;persist();closeModal();render();toast('个人记录已清空');return}}
$('app').addEventListener('click',handleClick);
$('app').addEventListener('change',e=>{if(e.target.id==='filterProject'){state.filter=e.target.value;persist();render()}else if(e.target.id==='filterRange'){state.range=e.target.value;persist();render()}});
$('filePicker').addEventListener('change',async e=>{let file=e.target.files[0];e.target.value='';if(!file)return;try{if(file.size>15*1024*1024)throw Error('备份文件超过 15MB');let d=validateBackup(JSON.parse(await file.text()));modalOpen('importCheck',{data:d})}catch(err){toast('无法导入：'+err.message)}});
window.addEventListener('keydown',e=>{if(e.key==='Escape'&&modal)closeModal()});
window.addEventListener('visibilitychange',()=>{if(!document.hidden)tick()});
render();ticker=setInterval(()=>{if(state.tab==='train')tick();$('clock').textContent=new Date().toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit',hour12:false})},500);
})();
</script>
</body>
